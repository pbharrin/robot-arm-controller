name: Build Apple Silicon app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build and test
        run: bash scripts/build_macos.sh
      - name: Smoke-test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 - <<'PY'
          import subprocess, time
          p = subprocess.Popen(['dist/Robot Arm Controller.app/Contents/MacOS/Robot Arm Controller'])
          try:
              time.sleep(3)
              assert p.poll() is None, 'Packaged application exited during launch'
          finally:
              p.terminate()
              p.wait(timeout=10)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Robot-Arm-Controller-macOS-arm64
          path: dist/Robot-Arm-Controller-macOS-arm64.zip
          if-no-files-found: error
